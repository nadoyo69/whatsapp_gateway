name: CI/CD Pipeline - WhatsApp Gateway

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # ==========================================================
  # JOB 1: Continuous Integration (Lint, Build & Validate)
  # ==========================================================
  ci-test-build:
    name: 🧪 CI - Build & Test Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      # Backend Checks
      - name: 📦 Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: 🔍 Check Backend Code Syntax
        working-directory: ./backend
        run: node -c src/server.js

      # Frontend Checks & Production Build Test
      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: 🏗️ Test Frontend Production Build
        working-directory: ./frontend
        run: npm run build

  # ==========================================================
  # JOB 2: Continuous Deployment (SSH ke Production Server)
  # ==========================================================
  cd-deploy:
    name: 🚀 CD - Deploy ke Server Production
    needs: ci-test-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy ke Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            echo "=================================================="
            echo "🚀 Memulai Deployment WhatsApp Gateway di Server..."
            echo "=================================================="

            echo "📍 Lokasi direktori target: ${{ secrets.SERVER_PATH }}"
            mkdir -p "${{ secrets.SERVER_PATH }}"
            cd "${{ secrets.SERVER_PATH }}" || exit 1
            echo "📂 Direktori aktif: $(pwd)"

            # 2. Periksa git repository (amankan file .env jika ada saat initial clone)
            if [ ! -d ".git" ]; then
              echo "📦 Repository belum ada di server, melakukan initial clone..."
              if [ -f .env ]; then
                cp .env /tmp/wa_gateway_env_backup
              fi
              git clone "https://nadoyo69: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@github.com/nadoyo69/whatsapp_gateway.git" .
              if [ -f /tmp/wa_gateway_env_backup ]; then
                cp /tmp/wa_gateway_env_backup .env
                rm -f /tmp/wa_gateway_env_backup
              fi
            fi

            echo "📥 Menarik kode terbaru dari branch..."
            git remote set-url origin "https://nadoyo69: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@github.com/nadoyo69/whatsapp_gateway.git"
            git fetch origin main || true
            git reset --hard origin/main || true

            # 3. Pastikan folder data dan direktori izin aman
            mkdir -p backups

            # 4. Pastikan file .env ada di server
            if [ ! -f .env ]; then
              echo "⚠️ File .env tidak ditemukan, membuat dari .env.example..."
              cp .env.example .env
            fi

            # 5. Build dan jalankan container dengan strategi Zero-Downtime
            echo "🐳 Melakukan build image di latar belakang (tanpa mematikan service aktif)..."
            if docker compose version > /dev/null 2>&1; then
              DOCKER_CMD="docker compose"
            else
              DOCKER_CMD="docker-compose"
            fi

            $DOCKER_CMD pull wa-postgres wa-mongo || true
            $DOCKER_CMD build

            echo "🔄 Menukar container dengan versi baru (waktu transisi < 1 detik)..."
            $DOCKER_CMD up -d --no-build --remove-orphans

            # 6. Bersihkan image usang/dangling untuk hemat kapasitas disk server
            echo "🧹 Membersihkan unused Docker images..."
            docker image prune -f || true

            echo "📊 Status Container Aktif:"
            $DOCKER_CMD ps

            echo "=================================================="
            echo "✅ Deployment WhatsApp Gateway Berhasil Selesai!"
            echo "=================================================="
