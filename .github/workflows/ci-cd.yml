name: CI/CD Pipeline - WhatsApp Gateway

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  ci-test-build:
    name: CI - Build & Test Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Check Backend Code Syntax
        working-directory: ./backend
        run: node -c src/server.js

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Test Frontend Production Build
        working-directory: ./frontend
        run: npm run build

  cd-deploy:
    name: CD - Deploy ke Server Production
    needs: ci-test-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy ke Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -ex
            echo "=================================================="
            echo "Memulai Deployment WhatsApp Gateway di Server..."
            echo "=================================================="

            echo "Target dir: ${{ secrets.SERVER_PATH }}"
            mkdir -p "${{ secrets.SERVER_PATH }}"
            cd "${{ secrets.SERVER_PATH }}"
            echo "Active dir: $(pwd)"

            REPO_URL="https://nadoyo69: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@github.com/nadoyo69/whatsapp_gateway.git"

            if [ ! -d ".git" ]; then
              echo "Initializing git repository..."
              git init
              git remote add origin "$REPO_URL" || true
            fi

            echo "Fetching and checking out latest code..."
            git remote set-url origin "$REPO_URL"
            git fetch origin main
            git checkout -f -B main origin/main
            git reset --hard origin/main

            mkdir -p backups

            if [ ! -f .env ]; then
              echo "Creating .env from .env.example..."
              cp .env.example .env
            fi

            echo "Preparing Docker Compose..."
            if docker compose version > /dev/null 2>&1; then
              DOCKER_CMD="docker compose"
            else
              DOCKER_CMD="docker-compose"
            fi

            echo "Building and restarting containers..."
            $DOCKER_CMD pull wa-postgres wa-mongo || true
            $DOCKER_CMD build
            $DOCKER_CMD up -d --remove-orphans
            docker image prune -f || true

            echo "Current containers status:"
            $DOCKER_CMD ps

            echo "=================================================="
            echo "Deployment WhatsApp Gateway Selesai!"
            echo "=================================================="