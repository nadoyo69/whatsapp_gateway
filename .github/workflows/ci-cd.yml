name: CI/CD Pipeline - WhatsApp Gateway

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  ci-test-build:
    name: CI - Build & Test Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Check Backend Code Syntax
        working-directory: ./backend
        run: node -c src/server.js

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Test Frontend Production Build
        working-directory: ./frontend
        run: npm run build

  cd-deploy:
    name: CD - Deploy ke Server Production
    needs: ci-test-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy ke Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            set -ex
            echo "=================================================="
            echo "Memulai Deployment WhatsApp Gateway di Server..."
            echo "=================================================="

            echo "Target dir: ${{ secrets.SERVER_PATH }}"
            mkdir -p "${{ secrets.SERVER_PATH }}"
            cd "${{ secrets.SERVER_PATH }}"
            echo "Active dir: $(pwd)"

            REPO_URL="git@github.com:nadoyo69/whatsapp_gateway.git"
            export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
            # Bila ada kunci khusus server (didaftarkan di akun GitHub), pakai itu saja; kalau tidak, kunci bawaan ssh.
            # "|| true" di akhir WAJIB ada: kalau file tidak ada, exit code baris ini tetap 0 sehingga
            # script_stop:true tidak ikut menghentikan deploy (lihat catatan di langkah docker compose di bawah).
            [ -f "$HOME/.ssh/id_ed25519_nadoyo" ] && export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/id_ed25519_nadoyo -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o BatchMode=yes" || true

            if [ ! -d ".git" ]; then
              echo "Initializing git repository..."
              git init
              git remote add origin "$REPO_URL" || true
            fi

            echo "Fetching and checking out latest code..."
            git remote set-url origin "$REPO_URL"
            git fetch origin main || { echo "GAGAL fetch via SSH: pastikan kunci SSH server terdaftar di GitHub (akun nadoyo69 atau deploy key repo whatsapp_gateway)"; exit 1; }
            git checkout -f -B main origin/main
            git reset --hard origin/main

            mkdir -p backups

            if [ ! -f .env ]; then
              echo "GAGAL: .env tidak ada di server. Buat dari .env.example dan ganti semua nilai CHANGE_ME, lalu deploy ulang."
              exit 1
            fi

            # Sisa langkah (deteksi docker compose vs docker-compose, build, up, prune) dijalankan
            # sebagai proses bash terpisah via scripts/deploy.sh. Ini WAJIB: script_stop:true di atas
            # menyisipkan cek "stop kalau exit code != 0" setelah SETIAP baris, termasuk baris di dalam
            # blok if/then — jadi deteksi "docker compose version || docker-compose" tidak pernah sampai
            # ke cabang else-nya kalau ditulis inline di sini. Proses bash baru tidak terkena instrumentasi itu.
            chmod +x scripts/deploy.sh
            bash scripts/deploy.sh

            echo "=================================================="
            echo "Deployment WhatsApp Gateway Selesai!"
            echo "=================================================="

  # ==========================================================
  # JOB 3: Telegram Notification (Success & Failure Alerts)
  # ==========================================================
  notify:
    name: 📢 Telegram Notification
    needs: [ci-test-build, cd-deploy]
    if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: 📱 Send Telegram Notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHATID: ${{ secrets.TELEGRAM_CHATID }}
          CI_STATUS: ${{ needs.ci-test-build.result }}
          CD_STATUS: ${{ needs.cd-deploy.result }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHATID" ]; then
            echo "⚠️ TELEGRAM_TOKEN or TELEGRAM_CHATID is not set. Skipping Telegram notification."
            exit 0
          fi

          SHORT_SHA=$(echo "$SHA" | cut -c1-7)
          CLEAN_MSG=$(echo "$COMMIT_MSG" | head -n 1 | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          if [ "$CI_STATUS" = "success" ] && [ "$CD_STATUS" = "success" ]; then
            TEXT="🚀 <b>Deployment Berhasil!</b> ✅%0A%0A📦 <b>Proyek:</b> WhatsApp Gateway (NexforgexGateway)%0A🌿 <b>Branch:</b> <code>$BRANCH</code>%0A🔖 <b>Commit:</b> <code>$SHORT_SHA</code>%0A💬 <b>Pesan:</b> $CLEAN_MSG%0A👤 <b>Oleh:</b> $ACTOR%0A🔗 <a href=\"$RUN_URL\">Buka Detail GitHub Action</a>"
          else
            FAILED_STAGE="CD - Deploy ke Server"
            if [ "$CI_STATUS" != "success" ]; then
              FAILED_STAGE="CI - Build & Test Validation"
            fi
            TEXT="🚨 <b>Deployment GAGAL!</b> ❌%0A%0A📦 <b>Proyek:</b> WhatsApp Gateway (NexforgexGateway)%0A🌿 <b>Branch:</b> <code>$BRANCH</code>%0A🔖 <b>Commit:</b> <code>$SHORT_SHA</code>%0A⚠️ <b>Tahap Gagal:</b> <code>$FAILED_STAGE</code>%0A💬 <b>Pesan:</b> $CLEAN_MSG%0A👤 <b>Oleh:</b> $ACTOR%0A🔗 <a href=\"$RUN_URL\">Lihat Log Kesalahan</a>"
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHATID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            -d "text=${TEXT}"