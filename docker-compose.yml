services:
  # 1. PostgreSQL Database (Relational Data: Users, API Keys, Devices/Sessions)
  # Catatan: Port tidak diekspos ke host agar database hanya bisa diakses oleh docker internal
  wa-postgres:
    image: postgres:16-alpine
    container_name: wa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-wa_gateway_db}
      POSTGRES_USER: ${DB_USER:-wa_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wa_secret_123}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wa_admin} -d ${DB_NAME:-wa_gateway_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wa_network

  # 2. MongoDB Database (High-Throughput Logs: Raw WhatsApp Messages, Chats, Webhook History)
  # Catatan: Port tidak diekspos ke host agar database hanya bisa diakses oleh docker internal
  wa-mongo:
    image: mongo:7.0
    container_name: wa-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-wa_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-wa_secret_123}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-wa_gateway_logs}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wa_network

  # 3. Node.js Backend (Baileys WA Gateway + REST API + Socket.IO)
  wa-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wa-backend
    restart: unless-stopped
    depends_on:
      wa-postgres:
        condition: service_healthy
      wa-mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: wa-postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-wa_gateway_db}
      DB_USER: ${DB_USER:-wa_admin}
      DB_PASSWORD: ${DB_PASSWORD:-wa_secret_123}
      MONGO_HOST: wa-mongo
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB:-wa_gateway_logs}
      MONGO_USER: ${MONGO_USER:-wa_admin}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-wa_secret_123}
      JWT_SECRET: ${JWT_SECRET:-wa_super_secret_jwt_key_2026}
      DEFAULT_API_TOKEN: ${DEFAULT_API_TOKEN:-wa_secret_token_default_key_2026}
      ADMIN_DEFAULT_USER: ${ADMIN_DEFAULT_USER:-admin}
      ADMIN_DEFAULT_PASS: ${ADMIN_DEFAULT_PASS:-admin123}
      CLIENT_URL: ${CLIENT_URL:-https://whatsapp.nexforgex.my.id,*}
      SESSIONS_PATH: /app/sessions
      UPLOADS_PATH: /app/uploads
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - sessions_data:/app/sessions
      - uploads_data:/app/uploads
    networks:
      - wa_network
      - npm_network

  # 4. Vue 3 Admin Dashboard (Nginx Web Server + Reverse Proxy)
  wa-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wa-frontend
    restart: unless-stopped
    depends_on:
      - wa-backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - wa_network
      - npm_network

volumes:
  pg_data:
    driver: local
  mongo_data:
    driver: local
  sessions_data:
    driver: local
  uploads_data:
    driver: local

networks:
  wa_network:
    driver: bridge
  npm_network:
    external: true
